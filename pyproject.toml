[project]
name = "eifi1-server-kit"
version = "0.28.0"
description = "The backend sibling of @eifi1/ui-kit: the cross-app contracts (feedback, uploads, limiter, CORS, translation review, sign-in and the account, user administration, settings, the demo, billing, mail) as pure, framework-light code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcel Eifert" }]
requires-python = ">=3.14"
# Layer 1 is pure functions, Pydantic models and one Starlette middleware — no FastAPI,
# no SQLAlchemy, no Pillow. Every app already has these two through FastAPI; the floors
# are the apps' own floors, and there are deliberately NO ceilings: keksdose holds
# FastAPI below 0.137 (its http.route metric label), and a ceiling here could only ever
# fight that pin, never help it.
dependencies = [
    "pydantic>=2.10.0",
    "starlette>=0.40.0",
]

[project.optional-dependencies]
# `uploads.ensure_decodable_image` (keksdose's dev#510 guard) parses a picture with Pillow;
# everything else in the kit runs without it, so it is an extra and imported lazily.
# keksdose's floor, no ceiling.
images = ["pillow>=11.0.0"]
# `mail.ResendClient` posts to Resend with httpx, which all three apps already have for
# their own Resend clients; the texts, the layout and the console transport need nothing.
# The apps' floor, no ceiling.
mail = ["httpx>=0.28.0"]
# `billing.PaddleClient` calls Paddle Billing's API with httpx (checkout, portal, cancel and
# undoing a cancel); the rest of billing — settings, plans, standing, webhooks, notices,
# `billing.testing` — needs nothing, and httpx is imported lazily. The apps' floor, no
# ceiling (billing-harmonization §14.1).
billing = ["httpx>=0.28.0"]
# `feedback.router` (layer 2) builds the feedback routes with FastAPI, and FastAPI's
# `UploadFile` reads the upload's multipart body with python-multipart; the ports, the
# service and `feedback.testing` need neither, and the router says which extra it needs
# when it is missing. The apps' floors, no ceiling: keksdose holds FastAPI below 0.137
# itself (server-services-harmonization §2.1). `translation_review.router` (0.10) needs
# FastAPI only; its ports, service and testing module need neither.
fastapi = ["fastapi>=0.115.0", "python-multipart>=0.0.18"]
# `sync.mixin` (the columns, the before_flush stamping, tombstones, the tombstone filter)
# is SQLAlchemy ORM code; `sync`'s schemas, merge rule, paging and counter port need nothing,
# and the mixin is imported lazily. Both apps' floor, no ceiling (local-first §1.6).
sync = ["sqlalchemy>=2.0.0"]
# `auth.sql` (layer 2, decision C of 2026-11-13): the account tables as declarative mixins
# and the account ports' stores over them, on SQLAlchemy's asyncio extension (the apps'
# AsyncSession, which needs greenlet). Imported lazily; the ports, the service and
# `auth.testing` need none of it. The apps' floor, no ceiling.
sql = ["sqlalchemy[asyncio]>=2.0.0"]
# `objects.GcsObjectStore` (0.26) reaches a Cloud Storage bucket through Google's own client,
# keyless: Application Default Credentials, on Cloud Run the runtime service account. The
# protocol, `LocalObjectStore` and `purge_objects` need nothing, and the client is imported
# lazily. No app has a floor yet: 3.0, the line the kit is tested on. No ceiling.
gcs = ["google-cloud-storage>=3.0.0"]
# `objects.S3ObjectStore` (0.26) speaks the S3 API with minio, as keksdose's
# `S3InvoiceFileStore` does against storage.googleapis.com with an HMAC pair; imported
# lazily. keksdose's floor, no ceiling.
s3 = ["minio>=7.2.20"]

[project.urls]
Contract = "https://github.com/Eifi1/ui-kit/blob/main/docs/feedback-harmonization.md"

[dependency-groups]
dev = [
    # The `sql` extra's stores are tested on SQLite in memory through its asyncio driver, the
    # same statements an app runs on asyncpg (auth-harmonization §12.3, decision C).
    "aiosqlite>=0.21.0",
    # `auth.testing.SoftAuthenticator` builds attestation objects and authenticator data in
    # CBOR, as a browser's authenticator does; py_webauthn (the passkeys extra) depends on it.
    "cbor2>=5.6.0",
    # The tests drive the CORS middleware through a real FastAPI app beside Starlette's
    # CORSMiddleware, the same way keksdose's own test does. Capped at the newest release
    # the kit's full check has passed on (0.157, round 0.48): kastlan and Kurvenschmiede
    # pin no ceiling (they lock 0.141.1 and 0.143.0), keksdose caps itself at <0.137, so
    # the lock below sits at or past the newest version any app runs. Raise it after a
    # green `scripts/check.sh` on the next release, never past one that has not run.
    "fastapi>=0.115.0,<0.158",
    # The `gcs` extra, so `GcsObjectStore` is tested against the client's own exceptions and
    # its keyless default construction, through a stub client: no network, no bucket.
    "google-cloud-storage>=3.0.0",
    # The `mail` and `billing` extras, so ResendClient and PaddleClient are tested against
    # httpx's MockTransport — and the client FastAPI's tests drive an app with.
    "httpx>=0.28.0",
    # The `s3` extra, so `S3ObjectStore` is tested against minio's own `S3Error`, through a
    # stub client: no network, no bucket.
    "minio>=7.2.20",
    "mypy>=1.18.0",
    # The `images` extra, so `ensure_decodable_image` is tested against real pictures.
    "pillow>=11.0.0",
    # Every app reads its settings through pydantic-settings, so the tests read
    # `BillingSettings` from the environment through it too. A dev dependency only: the kit
    # uses its `NoDecode` marker where it is installed (2.7 has it), and needs nothing else.
    "pydantic-settings>=2.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    # The `fastapi` extra's second half: the feedback router's tests upload through
    # FastAPI's `UploadFile`, which needs it.
    "python-multipart>=0.0.18",
    "ruff>=0.9.0",
    # The `sync` extra, so the stamping hook and the tombstone filter are tested on SQLite
    # in memory.
    "sqlalchemy[asyncio]>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Kurvenschmiede's rule: a deprecation is the one notice a dependency gives before it
# breaks us, so it is an error here rather than ignored.
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["eifi1_server_kit"]
branch = true

[tool.coverage.report]
fail_under = 97
show_missing = true
# Anchored, as keksdose learnt the hard way: a bare "pass" excluded every line that
# CONTAINED it, block headers included.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "^\\s*pass$", "^\\s*\\.\\.\\.$", "class .*\\(Protocol\\):"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# keksdose's set (E F I N W UP), plus the families Kurvenschmiede runs that a new
# codebase can start clean on.
select = ["B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]
# UP042: the enums subclass ``(str, enum.Enum)`` on purpose — they are DB columns and
# JSON-contract types in all three apps, and StrEnum changes str()/format().
# RUF001-003: the prose is typeset ("…", "–", "×"), as in Kurvenschmiede.
ignore = ["E501", "UP042", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pep8-naming]
# SQLAlchemy's `declared_attr` makes a class-level attribute of a method whose first argument
# is the class (`auth.sql`'s foreign keys and table arguments), so `cls` is right, not `self`.
classmethod-decorators = ["sqlalchemy.orm.declared_attr", "sqlalchemy.orm.declared_attr.directive"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N817"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
# google-api-core's and google-auth's exceptions are typed packages whose constructors are
# not: raising one (the object store's tests) is a call mypy may not see into.
untyped_calls_exclude = ["google.api_core.exceptions", "google.auth.exceptions"]

[[tool.mypy.overrides]]
# google-cloud-storage ships no types (no py.typed, no stubs): `GcsObjectStore`'s client and
# bucket are Any to mypy, and the store says what it reads from them.
module = ["google.cloud", "google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true
